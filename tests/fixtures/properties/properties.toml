# A tree with one of each gap, for tests/properties.rs to prove it catches them.
owed = ["src/paid_off.rs", "src/effect.rs"]

[pure]
"src/ok.rs" = ["holds"]
"src/misnamed.rs" = ["holds", "not_there"]
"src/not_a_property.rs" = ["plain_test"]
"src/bare.rs" = []
"src/paid_off.rs" = ["holds"]

[effectful]
"src/effect.rs" = "writes files"
"src/silent.rs" = ""
"src/gone.rs" = "was deleted"
