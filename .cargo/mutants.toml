# cargo-mutants configuration. Method: the `rust-mutation-testing` skill;
# workon's specifics (findings, why each exclusion) are in AGENTS.md.
# local-mutants: mutation runs on the changed code happen before each release, outside CI; session::run and live DB provisioners are in exclude_re, and tests use temp dirs and stand-in binaries.

# Copy only what a fresh clone has. Without this every build directory gets
# fuzz/target (1.1G) and the fixtures' installed deps (node_modules, vendor,
# .venv: 466M), and a local run no longer matches CI, which has neither.
gitignore = true

exclude_globs = [
    # Compiled only under `--cfg fuzzing` (cargo-fuzz). `cargo test` never
    # builds it, so every mutant here would compile, run nothing and read MISSED.
    "src/fuzz_api.rs",
]

exclude_re = [
    # Code whose effect only a live database server can show. Without Postgres
    # or MySQL every path through these returns the same empty `Setup` (or does
    # nothing), so a mutant cannot change anything a test can observe. They are
    # asserted by the DB-gated cycle tests, which run in ci.yml's `provisioners`
    # job with Postgres, MySQL and one toolchain per fixture ecosystem; mutation
    # runs have none of that, and the pure helpers these call (adapter parsing,
    # test_db_name, the URL and connection-string encoders) are still mutated.
    'DbEngine::create',
    'Resource::teardown',
    'replace mysqladmin ',
    '<impl Provisioner for (Rails|Prisma|Alembic|Django|Laravel|EfCore|Phoenix)>::setup',
    # session::run hands the terminal to a real zellij (attach or a new
    # session); its decisions are session_exists and delete_session, tested
    # with a stand-in. Replacing the whole body changes only that hand-off.
    '^src/session\.rs:.*replace run -> Result<\(\)> with Ok\(\(\)\)',
    # The default body is `Vec::new()`, so `vec![]` is the same value.
    '^src/vcs/mod\.rs:.*replace Vcs::stranded_work -> Vec<String> with vec!\[\]$',
    # exec's Windows `run` is under `cfg(not(unix))`: mutation runs build on
    # Linux and macOS, where it is never compiled, so any mutant of it reads
    # MISSED. Its Unix twin is mutated and caught by the exec CLI tests.
    '^src/exec\.rs:5[4-9]:.*replace run -> std::io::Result<ExitCode>',
]

# A hung mutant (a loop counter turned the wrong way) is stopped after this multiple of the
# baseline test time; the default is 5. A timeout is counted as caught.
timeout_multiplier = 2.0
