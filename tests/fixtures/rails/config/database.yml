# Names here belong to the primary checkout. A workspace suffixes development
# and test; the replica is left alone.
default: &default
  adapter: postgresql
  pool: 5

development:
  primary:
    <<: *default
    database: workon_rails_fixture_development
  primary_replica:
    <<: *default
    database: workon_rails_fixture_replica
    replica: true

test:
  primary:
    <<: *default
    database: workon_rails_fixture_test
