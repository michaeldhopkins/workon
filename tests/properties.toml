# Every source file, classified, so pure logic is covered by property tests.
# `tests/properties.rs` enforces it.
#
# A `pure` file's behaviour is a function of its inputs and names the property tests
# (functions inside a `proptest!` block in that file) that cover it. An `effectful`
# file says in a line why it is not pure. A pure file with no properties yet goes in
# `owed`, which may only shrink: an entry that gains a property leaves in the same change.
#
# A file that mixes the two is pure when its parsers or encoders are the substance
# (each provisioner's `setup` runs tools, but what it reads from the repo is pure),
# and effectful when the pure helpers are incidental to driving a program.

owed = []

[pure]
"src/agent.rs" = [
  "expand_replaces_every_placeholder_and_nothing_else",
  "an_undeclared_capability_never_yields_args",
]
"src/cli.rs" = ["given_name_drops_only_the_empty_name"]
"src/deps.rs" = [
  "parse_major_minor_reads_the_first_two_numbers",
  "parse_major_minor_needs_a_numeric_minor",
]
"src/discover.rs" = ["is_strictly_inside_is_a_proper_component_prefix"]
"src/forget_hint.rs" = ["one_sorted_forget_line_per_name", "a_quoted_word_unquotes_to_the_original"]
"src/not_ready.rs" = ["only_n_or_no_keeps_the_session_closed"]
"src/mux/kind.rs" = ["parse_succeeds_iff_the_name_is_known"]
"src/mux/panes.rs" = ["commanded_panes_read_back_in_order"]
"src/layout.rs" = [
  "a_valid_config_name_stays_inside_the_configs_dir",
  "command_in_line_reads_the_pane_command_back",
]
"src/provision/alembic.rs" = ["configured_url_is_the_first_non_blank_sqlalchemy_url"]
"src/provision/ef_core.rs" = [
  "npgsql_value_reads_back_as_the_original",
  "include_value_reads_back_in_either_quote",
]
"src/provision/laravel.rs" = ["the_db_connection_value_reads_back"]
"src/provision/mod.rs" = ["mysql_url_carries_any_given_port"]
"src/provision/phoenix.rs" = [
  "partition_is_the_sanitized_ws_id_cut_to_fit",
  "app_name_reads_the_app_atom_past_comments_and_lookalikes",
]
"src/provision/prisma.rs" = ["the_datasource_provider_and_url_var_read_back"]
"src/provision/rails.rs" = ["adapter_is_the_first_adapter_line_with_a_value"]
"src/spawn_retry.rs" = ["only_etxtbusy_reads_as_a_busy_executable"]
"src/stale.rs" = [
  "a_path_is_dropped_exactly_when_it_sits_inside_a_stale_output_dir",
  "drift_fires_exactly_when_the_lockfiles_differ_or_the_workspace_lacks_one",
]
"src/registered.rs" = [
  "path_selects_the_registered_name_not_the_directory",
  "a_prefixed_directory_does_not_match_its_stripped_suffix",
  "a_list_line_round_trips_including_an_empty_root",
  "a_root_with_space_or_newline_round_trips",
  "a_json_name_round_trips",
  "two_names_for_one_root_are_refused",
  "a_nickname_selects_the_registered_name",
  "only_the_workspace_named_default_is_left_unreported",
]
"src/zellij_reply.rs" = ["a_listing_finds_exactly_the_sessions_named_first_on_a_line"]

[effectful]
"src/exec.rs" = "replaces the process with the user's command in the workspace"
"src/background.rs" = "deletes a directory on a background thread"
"src/claude_trust.rs" = "reads and rewrites ~/.claude.json"
"src/fuzz_api.rs" = "fuzzing shims compiled only under --cfg fuzzing; the fuzz targets are its properties"
"src/home.rs" = "reads $HOME"
"src/lib.rs" = "module declarations, plus a test-only helper that writes stand-in scripts"
"src/main.rs" = "the binary's entry point: parses argv and dispatches"
"src/mise_env.rs" = "runs mise; its output is parsed by serde_json"
"src/mux/mod.rs" = "runs the selected multiplexer"
"src/mux/tmux.rs" = "runs tmux; pane_args and capture_args are ordinary tests"
"src/mux/zellij.rs" = "runs zellij; create_args is an ordinary test"
"src/mux/zmx.rs" = "runs zmx; run_args and send_args are ordinary tests"
"src/provision/django.rs" = "runs manage.py; detection reads settings files from disk"
"src/provision/python_venv.rs" = "rewrites a copied virtualenv's files in place"
"src/save_prompt.rs" = "reads the answer to the save prompt from stdin"
"src/resolve.rs" = "reads the current directory and the repository root"
"src/session.rs" = "drives zellij and ps; its parsers (parse_descendants, anchored_server_pattern) are fuzzed by ps_tree and encoders"
"src/trust.rs" = "reads and writes the trust manifest and the configs it hashes"
"src/vcs/git.rs" = "runs git"
"src/vcs/jj.rs" = "runs jj and git"
"src/vcs/trunk.rs" = "runs jj; its one pure function, unresolved_trunk, has the property the_unresolved_trunk_error_matches_what_the_repo_holds"
"src/vcs/mod.rs" = "detects the repository's VCS and edits .git/info/exclude"
"src/workspace.rs" = "creates, attaches and destroys worktrees: files, VCS, provisioners and zellij"
