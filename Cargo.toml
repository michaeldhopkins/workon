[package]
name = "workon"
version = "0.22.1"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Development workspace launcher with Zellij, Claude CLI, and branchdiff"
repository = "https://github.com/michaeldhopkins/workon"

[[bin]]
name = "workon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
clonetree = "0.0.2"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
vcs-runner = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
which = "7"

[dev-dependencies]
assert_cmd = "2"
clap_mangen = "0.2"
predicates = "3"
tempfile = "3"

[lints.clippy]
struct-excessive-bools = "deny"
fn-params-excessive-bools = "deny"
match_bool = "warn"
bool_to_int_with_if = "warn"
cognitive-complexity = "warn"
too-many-lines = "warn"
collapsible-if = "deny"
too-many-arguments = "deny"
needless-range-loop = "deny"
extend_with_drain = "deny"
