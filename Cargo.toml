[package]
name = "workon"
version = "0.24.6"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Development workspace launcher with Zellij, Claude CLI, and branchdiff"
repository = "https://github.com/michaeldhopkins/workon"

[[bin]]
name = "workon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
clonetree = "0.0.2"
# KDL v1, matching zellij's layout dialect (zellij 0.43 itself uses kdl 4.5).
# Pinned to the major on purpose: kdl 6.x implements KDL v2, which rejects most
# zellij layouts — including zellij's own shipped defaults. Do not bump across it.
kdl = "4"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
vcs-runner = "0.19.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
which = "7"

[dev-dependencies]
# syn + proc-macro2: tests/file_length.rs parses the crate's own source to leave tests out of
# each file's count; a text scan is fooled by strings and comments. `span-locations` gives it
# exact line spans.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
assert_cmd = "2"
clap_mangen = "0.2"
predicates = "3"
proptest = "1"
tempfile = "3"

[lints.clippy]
struct-excessive-bools = "deny"
fn-params-excessive-bools = "deny"
match_bool = "warn"
bool_to_int_with_if = "warn"
cognitive-complexity = "warn"
too-many-lines = "warn"
collapsible-if = "deny"
too-many-arguments = "deny"
needless-range-loop = "deny"
extend_with_drain = "deny"

[lints.rust]
# `cargo fuzz` builds with `--cfg fuzzing`, which gates `src/fuzz_api.rs`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
